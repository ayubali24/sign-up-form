<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form>
        <fieldset>
            <legend>Let's do this!</legend>
            <label for="firstname">First Name*</label>
            <input type="text" id="firstname" name="firstname" pattern="[A-Za-z]" placeholder="John" title="Must include only Alpha Characters" required />

            <label for="lastname">Last Name*</label>
            <input type="text" id="lastname" name="lastname" pattern="[A-Za-z]" placeholder="Doe" title="Must include only Alpha Characters" required/>

            <label for="email">Email*</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required/>

            <label for="phonenumber">Phone Number*</label>
            <input type="tel" id="phonenumber" name="phonenumber" pattern="\([0-9]{3}\) [0-9]{3}-[0-9]{4}" placeholder="Example: (111) 111-1111" title="(111) 111-1111" required/>

            <label for="password">Password*</label>
            <input type="password" id="password" name="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" required/>

            <label for="confirm-password">Confirm Password*</label>
            <input type="password" id="confirm-password" name="confirm-password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" required/>
            
        </fieldset>
        <fieldset>
            <button id="create-account" type="Submit">Create Account</button>
            <p>Already have an account?</p>
            <button type="button" id="login">Log In</button>
        </fieldset>
        
    
    </form>
    <div>
        
    </div>
   
</body>
</html>
