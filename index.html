<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-container">
        <img src="./halie-west-25xggax4bSA-unsplash.jpg" />
        <div id="odin-logo">
            ODIN
        </div>
        <p id="footer">Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"> Halie West </a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
    </div>
    <div class="form-container">
        <form>
            <div class="text-container">
                <div class="text-children">
                    <p>
                        This is not a real online service! You know you need something like this in your
                        life to help you realize your deepest dreams. Sign up <i>now</i> to get started.
                    </p>
                    <p>
                        You <i>know</i> you want to.
                    </p>
                </div>
             
            </div>
            
            <fieldset id="fieldset-info">
            <legend>Let's do this!</legend>

                <div class="name-row">
                    <div class="first-name">
                        <label for="firstname">First Name*</label>
                        <input type="text" id="firstname" name="firstname" pattern="[A-Za-z]" placeholder="John"
                            title="Must include only Alpha Characters" required />
                    </div>
                    <div class="last-name">
                        <label for="lastname">Last Name*</label>
                        <input type="text" id="lastname" name="lastname" pattern="[A-Za-z]" placeholder="Doe"
                            title="Must include only Alpha Characters" required />
                    </div>
                </div>
        
                <div class="contact-row">
                    <div class="email">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required />
                    </div>
                    <div class="number">
                        <label for="phonenumber">Phone Number*</label>
                        <input type="tel" id="phonenumber" name="phonenumber" pattern="\([0-9]{3}\) [0-9]{3}-[0-9]{4}"
                            placeholder="Example: (111) 111-1111" title="(111) 111-1111" required />
                    </div>
                </div>
        
                <div class="password-row">
                    <div class="password">
                        <label for="password">Password*</label>
                        <input type="password" id="password" name="password" required />
                    </div>
        
                    <div class="confirm-password">
                        <label for="confirm-password">Confirm Password*</label>
                        <input type="password" id="confirm-password" name="confirm-password" required />
                    </div>
        
            </fieldset>
            <fieldset id="fieldset-account">
                <button id="create-account" type="Submit">Create Account</button>
                <p>Already have an account?</p>
                <button type="button" id="login">Log In</button>
            </fieldset>
        
        </form>
    </div>
    
   
</body>
</html>
